name: os_2604
description: "15-second morning self-check MVP"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  drift: ^2.35.1
  drift_flutter: ^0.3.1
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.15.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1
  test: ^1.31.1
  fake_async: ^1.3.3
  camera_platform_interface: ^2.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
    - assets/sounds/
    # 計測中に1秒ごとに鳴らす音階（ド〜ドの15音）。tool/generate_scale_notes.py で作成。
    - assets/sounds/scale/marimba/
    - assets/sounds/scale/glockenspiel/
    - assets/sounds/scale/musicbox/
    - assets/sounds/scale/kalimba/
    - assets/sounds/scale/harp/
    - assets/sounds/scale/koto/
    - assets/sounds/scale/soft/
    - assets/sounds/scale/pachinko/
  # 端末内に同梱する（実行時に取得しない）。ライセンスは assets/fonts/OFL-*.txt。
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.otf
        - asset: assets/fonts/NotoSansJP-Medium.otf
          weight: 500
        - asset: assets/fonts/NotoSansJP-Bold.otf
          weight: 700
    - family: ZenMaruGothic
      fonts:
        - asset: assets/fonts/ZenMaruGothic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ZenMaruGothic-Bold.ttf
          weight: 700
        - asset: assets/fonts/ZenMaruGothic-Black.ttf
          weight: 900
